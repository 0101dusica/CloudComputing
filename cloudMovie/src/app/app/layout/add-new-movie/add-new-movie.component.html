<div class="main">
    <app-nav-bar [id]="0"></app-nav-bar>

    <div class="container">
      <form (ngSubmit)="onSubmit()">
        <div class="form-group">
          <label for="thumbnail">Thumbnail</label>
          <input type="file" id="thumbnail" (change)="onFileSelected($event, 'thumbnail')" class="form-control" />
        </div>
        <div class="form-group">
          <label for="video">Video</label>
          <input type="file" id="video" (change)="onFileSelected($event, 'video')" class="form-control" />
        </div>
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" [(ngModel)]="movie.title" name="title" class="form-control" required />
        </div>
        <div class="form-group">
          <label for="year">Release Year</label>
          <input type="number" id="year" [(ngModel)]="movie.year" name="year" class="form-control" required />
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" [(ngModel)]="movie.description" name="description" class="form-control" required></textarea>
        </div>
        <div class="form-group">
            <label>Actors</label>
            <div class="options-wrap">
                <div class="option-box" *ngFor="let actor of actors">
                <input type="checkbox" [id]="actor" [value]="actor" (change)="onCheckboxChange($event, 'actors')"/>
                <label class="options" [for]="actor">{{ actor }}</label>
                </div>
            </div>
          </div>
          <div class="form-group">
            <label>Directors</label>
            <div class="options-wrap">
                <div class="option-box" *ngFor="let director of directors">
                <input type="checkbox" [id]="director" [value]="director" (change)="onCheckboxChange($event, 'directors')"/>
                <label class="options" [for]="director">{{ director }}</label>
                </div>
            </div>
          </div>
          <div class="form-group">
            <label>Genres</label>
            <div class="options-wrap">
                <div class="option-box" *ngFor="let genre of genres">
                    <input type="checkbox" [id]="genre" [value]="genre" (change)="onCheckboxChange($event, 'genres')"/>
                    <label class="options" [for]="genre">{{ genre }}</label>
                </div>
            </div>
          </div>
        <button type="submit" class="btn btn-primary">Add Movie</button>
      </form>
    </div>
</div>
