<div class="main">
    <app-nav-bar [id]="0"></app-nav-bar>

    <div class="container">
      <label class="title">Movie Informations</label>
      <form (ngSubmit)="onSubmit()" style="margin-top: 2%;">
        <div class="form-group">
          <label for="video">Movie</label>
          <input type="file" id="video" (change)="onFileSelected($event, 'video')" class="form-control" />
        </div>
        <div class="form-group">
          <label for="title">Title</label>
          <input type="text" id="title" [(ngModel)]="movie.title" name="title" class="form-control" required />
        </div>
        <div class="form-group">
          <label for="description">Description</label>
          <textarea id="description" [(ngModel)]="movie.description" name="description" class="form-control" required></textarea>
        </div>
        <div class="form-group">
          <label for="actors">Actors </label>
          <textarea id="actors" [(ngModel)]="actorsInput" name="actors" class="form-control" required></textarea>
        </div>

          <div class="form-group">
          <label for="director">Director</label>
          <select id="director" [(ngModel)]="movie.director" name="director" class="form-control" required>
            <option *ngFor="let director of directors" [value]="director">{{ director }}</option>
          </select>
        </div>
          <div class="form-group">
            <label>Genres</label>
            <div class="options-wrap">
                <div class="option-box" *ngFor="let genre of genres">
                    <input type="checkbox" [id]="genre" [value]="genre" (change)="onCheckboxChange($event, 'genres')"/>
                    <label class="options" [for]="genre">{{ genre }}</label>
                </div>
            </div>
          </div>
        <button type="submit" class="btn btn-primary">Add Movie</button>
      </form>
    </div>
</div>
