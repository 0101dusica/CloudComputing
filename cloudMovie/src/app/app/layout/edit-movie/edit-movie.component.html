<div class="main">
  <app-nav-bar [id]="0"></app-nav-bar>

  <div class="container">
    <label class="title">Edit Movie Information</label>
    <form style="margin-top: 2%;" *ngIf="movie">
      <div class="form-group">
        <label for="video">Movie</label>
        <div *ngIf="loadedFiles['video']; else videoInput">
          <span class="file-name">{{ movie!.fileName }}</span>
          <button class="btn-delete" type="button" (click)="deleteFile('video')">Delete Movie</button>
        </div>
        <ng-template #videoInput>
          <input type="file" id="video" (change)="onFileSelected($event, 'video')" class="form-control" />
        </ng-template>
      </div>
      <div class="form-group">
        <label for="title">Title</label>
        <input type="text" id="title" [(ngModel)]="movie!.title" name="title" class="form-control" required />
      </div>
      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" [(ngModel)]="movie!.description" name="description" class="form-control" required></textarea>
      </div>
      <div class="form-group" *ngIf="movie!.type === 'movie'">
        <label>Actors</label>
        <input type="text" id="actors" [(ngModel)]="actorsString" name="actors" class="form-control" required />
      </div>
      <div class="form-group" *ngIf="movie!.type === 'movie'">
        <label>Directors</label>
     <select id="director" [(ngModel)]="selectedDirector" name="director" class="form-control">
  <option *ngFor="let directorOption of directors" [ngValue]="directorOption">{{ directorOption }}</option>
</select>



      </div>
     <div class="form-group" *ngIf="movie!.type === 'movie'">
  <label>Genres</label>
  <div class="options-wrap">
    <div class="option-box" *ngFor="let genre of genres">
      <input type="checkbox" [id]="genre.name" [value]="genre.name" (change)="onCheckboxChange($event, genre.name)" [checked]="genre.isChecked" />
      <label class="options" [for]="genre.name">{{ genre.name }}</label>
    </div>
  </div>
</div>

<button type="submit" class="btn btn-primary" (click)="onSubmit()">Update Movie</button>
    </form>
  </div>
</div>
