<!DOCTYPE html>
<html>
    <body>
        <div class="background">
            <div class="login-container">   
                <form class="login-form" [formGroup]="registerForm">
                    <h2>Create Your Account</h2>
                    <input type="text" placeholder="Enter first name here.." formControlName="firstName" required>
                    <input type="text" placeholder="Enter last name here.." formControlName="lastName" required>
                    <input type="date" placeholder="Enter date of birth here.." formControlName="dob" required>
                    <input type="email" placeholder="Enter email here.." formControlName="email" required>
                    <input type="password" placeholder="Enter password here.." formControlName="password" required>
                    <button type="submit" (click)="onRegisterSubmit()">Register</button>
                </form>
                <div class="signup">
                    <p>Already have account ? <a [routerLink]="['/login']">Sign in</a></p>
                </div>
            </div>
        </div>
    </body>
</html>
